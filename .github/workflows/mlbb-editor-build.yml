name: MLBB Editor debug build
on:
  push:
    branches: [feature/mlbb-editor-foundation]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile TypeScript encoder and embed in APK
        run: |
          cd wwise-ts
          npm install --no-audit --no-fund
          npm test
          node scripts/package-android.cjs
      - name: Detect optional ARM64 VorbisLib
        run: |
          if [ -s app/src/main/cpp/prebuilt/arm64-v8a/libvorbislib.so ] && [ -s app/src/main/cpp/include/vorbislib.h ]; then
            echo "Native ARM64 VorbisLib found; JNI codec will be compiled"
          else
            echo "::warning::VorbisLib archive not yet installed in repository. APK will NOT contain native Custom Vorbis encoding."
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Build universal debug APK
        env:
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '0'
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify native library when supplied
        run: |
          LIB=app/src/main/cpp/prebuilt/arm64-v8a/libvorbislib.so
          if [ -s "$LIB" ]; then
            APK=$(find app/build/outputs/apk/debug -name '*universal*.apk' | head -n 1)
            test -n "$APK"
            unzip -l "$APK" | tee /tmp/mlbb-apk-files.txt
            grep -F 'lib/arm64-v8a/libvorbislib.so' /tmp/mlbb-apk-files.txt
            grep -F 'lib/arm64-v8a/libmlbb_vorbis_jni.so' /tmp/mlbb-apk-files.txt
          fi
      - name: Verify standalone package ID
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          AAPT=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | grep "package: name='com.farizgd.mlbbeditor'"
      - uses: actions/upload-artifact@v4
        with:
          name: MLBB-Editor-development-apk
          path: app/build/outputs/apk/debug/*.apk

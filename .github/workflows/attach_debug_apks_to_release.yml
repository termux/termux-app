name: Attach Signed APK To Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TERMUX_PACKAGE_VARIANT: apt-android-7
      TERMUX_SPLIT_APKS_FOR_RELEASE_BUILDS: "0"

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TERMUX_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TERMUX_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TERMUX_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TERMUX_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_BASE64" || {
            echo "::error::TERMUX_RELEASE_KEYSTORE_BASE64 is not configured."
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "::error::TERMUX_RELEASE_STORE_PASSWORD is not configured."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "::error::TERMUX_RELEASE_KEY_ALIAS is not configured."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "::error::TERMUX_RELEASE_KEY_PASSWORD is not configured."
            exit 1
          }

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.TERMUX_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TERMUX_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TERMUX_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/termux-defsix-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

          echo "TERMUX_RELEASE_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Set release version
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG="${{ github.event.release.tag_name }}"
          VERSION_NAME="${RELEASE_TAG#v}"

          echo "TERMUX_APP_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "TERMUX_APK_VERSION_TAG=$RELEASE_TAG-release" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          TERMUX_RELEASE_STORE_PASSWORD: ${{ secrets.TERMUX_RELEASE_STORE_PASSWORD }}
          TERMUX_RELEASE_KEY_ALIAS: ${{ secrets.TERMUX_RELEASE_KEY_ALIAS }}
          TERMUX_RELEASE_KEY_PASSWORD: ${{ secrets.TERMUX_RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Locate and rename APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/release"
          SOURCE_APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*_universal.apk' -print -quit)"

          if [ -z "$SOURCE_APK" ]; then
            echo "::error::No universal release APK was found in $APK_DIR."
            find "$APK_DIR" -maxdepth 1 -type f -print || true
            exit 1
          fi

          RELEASE_APK="$RUNNER_TEMP/termux-${RELEASE_TAG}.apk"
          cp "$SOURCE_APK" "$RELEASE_APK"

          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"
          echo "RELEASE_APK_NAME=termux-${RELEASE_TAG}.apk" >> "$GITHUB_ENV"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f \
            -name apksigner \
            -print | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner could not be found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$RELEASE_APK"

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail

          cd "$(dirname "$RELEASE_APK")"
          sha256sum "$RELEASE_APK_NAME" > "$RELEASE_APK_NAME.sha256"

          echo "RELEASE_CHECKSUM=$RELEASE_APK.sha256" >> "$GITHUB_ENV"

      - name: Set release channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "$RELEASE_TAG" == *"-rc"* ]]; then
            gh release edit "$RELEASE_TAG" \
              --prerelease \
              --latest=false
          else
            gh release edit "$RELEASE_TAG" \
              --prerelease=false \
              --latest
          fi

      - name: Upload signed APK and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" \
            "$RELEASE_APK" \
            "$RELEASE_CHECKSUM" \
            --clobber
name: Native renderer regressions

on:
  push:
    paths:
      - 'terminal-emulator/src/main/**'
      - 'terminal-view/src/**'
      - 'tools/native-tests/**'
      - '.github/workflows/native_renderer_tests.yml'
  pull_request:
    paths:
      - 'terminal-emulator/src/main/**'
      - 'terminal-view/src/**'
      - 'tools/native-tests/**'
      - '.github/workflows/native_renderer_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: tools/native-tests/pom.xml
      - name: Run native graphics and recorded PTY regressions
        run: sh tools/native-tests/run.sh

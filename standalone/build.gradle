plugins { id 'com.android.application' }

android {
    namespace 'com.farizgd.mlbbeditor'
    compileSdk 36
    ndkVersion '29.0.14206865'
    defaultConfig {
        applicationId 'com.farizgd.mlbbeditor'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { ndkBuild { arguments "NDK_APPLICATION_MK=" + file("src/main/cpp/Application.mk").absolutePath } }
    }
    sourceSets {
        main {
            assets.srcDirs '../app/src/main/assets'
        }
    }
    externalNativeBuild { ndkBuild { path 'src/main/cpp/Android.mk' } }
    buildTypes {
        release {
            minifyEnabled false
            // Signing is configured only by the release workflow with user-provided secrets.
        }
    }
    buildFeatures { aidl true }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation 'androidx.annotation:annotation:1.9.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
